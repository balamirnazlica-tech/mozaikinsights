<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Usage Analytics — Mozaik Insights</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/style.css?v=14">
<script src="/assets/auth.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
  .wrap{max-width:1200px;margin:28px auto 80px;padding:0 24px}
  .head h1{font-size:1.7rem;font-weight:700;color:#fff;margin:0 0 4px}
  .head p{color:#94a3b8;margin:0 0 22px;font-size:14px}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:24px}
  .kpi{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:18px 20px}
  .kpi .l{color:#94a3b8;font-size:12.5px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
  .kpi .v{color:#fff;font-size:28px;font-weight:700;margin-top:6px;font-variant-numeric:tabular-nums}
  .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:18px;margin-bottom:24px}
  .card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:18px 20px}
  .card h2{font-size:14px;font-weight:600;color:#e2e8f0;margin:0 0 14px}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th{text-align:left;color:#64748b;font-weight:600;padding:8px 10px;border-bottom:1px solid rgba(255,255,255,.08);font-size:12px;text-transform:uppercase;letter-spacing:.03em}
  td{padding:8px 10px;border-bottom:1px solid rgba(255,255,255,.05);color:#cbd5e1}
  td.num{text-align:right;font-variant-numeric:tabular-nums;color:#a5b4fc}
  .muted{color:#64748b}
  .err{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);color:#fca5a5;padding:14px 16px;border-radius:12px;margin-bottom:20px;font-size:14px}
  canvas{max-height:260px}
</style>
</head>
<body>
<nav class="nav">
  <div class="nav-inner">
    <a class="brand" href="../"><span class="brand-mark"></span><span class="brand-name">Mozaik Insights</span><span class="brand-sub">analytics hub</span></a>
    <ul>
      <li><a class="link" href="../">Home</a></li>
      <li><a class="link" href="../marketing/">Marketing</a></li>
      <li><a class="link" href="../sales/">Sales</a></li>
      <li><a class="link" href="../operations/">Operations</a></li>
      <li><a class="link" href="../projects/">Projects</a></li>
    </ul>
  </div>
</nav>

<div class="wrap">
  <div class="head">
    <h1>Usage Analytics</h1>
    <p id="sub">Who's using the dashboard, and which pages they view.</p>
  </div>
  <div id="msg"></div>
  <div class="kpis" id="kpis"></div>
  <div class="grid2">
    <div class="card"><h2>Top pages</h2><canvas id="pagesChart"></canvas></div>
    <div class="card"><h2>Views by person</h2><canvas id="usersChart"></canvas></div>
  </div>
  <div class="card" style="margin-bottom:18px"><h2>Recent activity</h2>
    <div style="overflow-x:auto"><table><thead><tr><th>When</th><th>Who</th><th>Page</th></tr></thead><tbody id="recent"></tbody></table></div>
  </div>
</div>

<script>
var ENDPOINT='https://script.google.com/macros/s/AKfycbzAJtBbhp3lBQ8MfcsqMt7AVM_5DiUIzj_y7BuMJDYnF6Rw7pUS85s4m2usyXkUNxeF/exec';
var TOKEN='izgS6KDacLVXhybRnQKNtQR';

function fmtPage(p){
  p=(p||'/'); var k=p.replace(/index\.html$/,''); if(k.length>1)k=k.replace(/\/$/,''); if(k==='')k='/';
  var NAMES={
    '/':'Home','/marketing':'Marketing','/sales':'Sales','/operations':'Operations','/projects':'Projects','/surveys':'Surveys','/analytics':'Usage Analytics',
    '/sales/sales-dashboard.html':'Sales Dashboard','/sales/Enterprise_Sales_Dashboard.html':'Enterprise Sales','/sales/leadership-guide.html':'Leadership Guide',
    '/sales/crm':'CRM','/sales/build-vs-buy':'CRM Build vs Buy','/sales/footfall':'Footfall (Traffic)','/sales/footfall/footfall-reps.html':'Footfall Per Rep',
    '/operations/footfall.html':'Ortaköy Footfall','/operations/outlet-footfall.html':'Outlet Footfall','/operations/Mozaik_Inventory_Dashboard_2026.html':'Inventory Dashboard','/operations/all-hands-june-2026':'All-Hands (June 2026)',
    '/marketing/mozaik-customer-intelligence.html':'Customer Intelligence','/marketing/mozaik-product-intelligence.html':'Product Intelligence','/marketing/mozaik-orders-dashboard.html':'Orders Dashboard',
    '/marketing/mozaik-unified-dashboard.html':'Unified Marketing','/marketing/mozaik-unified-dashboard-full.html':'Unified Marketing (Full)','/marketing/unified':'Unified Marketing','/marketing/marketing-dashboard.html':'Marketing Mission Control'
  };
  if(NAMES[k])return NAMES[k];
  var seg=k.replace(/\/$/,'').split('/').pop().replace(/\.html$/,'').replace(/[-_]+/g,' ').trim();
  if(!seg)return 'Home';
  return seg.replace(/\b\w/g,function(c){return c.toUpperCase();});
}
function ago(d){ var s=(Date.now()-new Date(d).getTime())/1000; if(s<60)return 'just now'; var m=s/60; if(m<60)return Math.floor(m)+'m ago'; var h=m/60; if(h<24)return Math.floor(h)+'h ago'; return Math.floor(h/24)+'d ago'; }

function render(rows){
  rows=(rows||[]).filter(function(r){
    if((r.event||'pageview')!=='pageview')return false;
    var nm=(r.name||'').toLowerCase().trim();
    if(!nm||nm.indexOf('test')>-1)return false;
    return true;
  });
  var byPage={}, byUser={}, users={};
  rows.forEach(function(r){
    var pg=fmtPage(r.page); byPage[pg]=(byPage[pg]||0)+1;
    var u=r.name||'(unknown)'; byUser[u]=(byUser[u]||0)+1; users[u]=1;
  });
  var dayAgo=Date.now()-86400000;
  var today=rows.filter(function(r){return new Date(r.ts).getTime()>dayAgo;}).length;
  var kpis=[['Total views',rows.length],['Unique people',Object.keys(users).length],['Pages tracked',Object.keys(byPage).length],['Views (24h)',today]];
  document.getElementById('kpis').innerHTML=kpis.map(function(k){return '<div class="kpi"><div class="l">'+k[0]+'</div><div class="v">'+k[1].toLocaleString()+'</div></div>';}).join('');

  var pe=Object.entries(byPage).sort(function(a,b){return b[1]-a[1];}).slice(0,10);
  var ue=Object.entries(byUser).sort(function(a,b){return b[1]-a[1];});
  bar('pagesChart',pe.map(x=>x[0]),pe.map(x=>x[1]),'#818cf8');
  bar('usersChart',ue.map(x=>x[0]),ue.map(x=>x[1]),'#34d399');

  var rec=rows.slice().sort(function(a,b){return new Date(b.ts)-new Date(a.ts);}).slice(0,50);
  document.getElementById('recent').innerHTML=rec.map(function(r){return '<tr><td class="muted">'+ago(r.ts)+'</td><td>'+(r.name||'—')+'</td><td>'+fmtPage(r.page)+'</td></tr>';}).join('')||'<tr><td colspan="3" class="muted">No activity yet</td></tr>';
}
function bar(id,labels,data,color){
  new Chart(document.getElementById(id),{type:'bar',data:{labels:labels,datasets:[{data:data,backgroundColor:color,borderRadius:6}]},options:{indexAxis:'y',plugins:{legend:{display:false}},scales:{x:{ticks:{color:'#64748b'},grid:{color:'rgba(255,255,255,.05)'}},y:{ticks:{color:'#cbd5e1'},grid:{display:false}}}}});
}
function showErr(t){ document.getElementById('msg').innerHTML='<div class="err">'+t+'</div>'; }

window.__usageCb=function(resp){ if(resp&&resp.ok){render(resp.rows);}else{showErr('Could not load log: '+((resp&&resp.error)||'unknown')); render([]);} };

(function(){
  if(!ENDPOINT||ENDPOINT.indexOf('script.google')<0){
    showErr('Analytics endpoint not configured yet. Showing sample data.');
    var demo=[],names=['Balamir Nazlıca','Zeynep Uzel','Burçin Karaca','Ceren Acar'],pages=['/sales/sales-dashboard.html','/operations/footfall.html','/marketing/','/sales/','/operations/'];
    for(var i=0;i<60;i++){demo.push({ts:Date.now()-Math.random()*6*86400000,name:names[i%names.length],page:pages[i%pages.length],event:'pageview'});}
    render(demo); return;
  }
  var s=document.createElement('script');
  s.src=ENDPOINT+'?token='+encodeURIComponent(TOKEN)+'&callback=__usageCb';
  s.onerror=function(){showErr('Failed to reach analytics endpoint.');render([]);};
  document.body.appendChild(s);
})();
</script>
<script src="/assets/nav.js"></script>
</body>
</html>
