<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KPI Tracker — Marketing — Mozaik Insights</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif;background:linear-gradient(180deg,rgba(167,139,250,.16),rgba(167,139,250,0) 360px),#070b17;color:#e5e7eb;margin:0}
.wrap{max-width:1180px;margin:0 auto;padding:28px 24px 80px}
.head h1{font-size:1.6rem;font-weight:700;color:#fff;margin:0 0 6px}
.head p{color:#94a3b8;margin:0;font-size:14px}
.banner{background:#0c1426;border:1px solid #1f2a44;border-left:3px solid #3b82f6;border-radius:10px;padding:10px 14px;font-size:12.5px;color:#94a3b8;margin:16px 0 0}
.banner b{color:#cbd5e1}
.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:20px 0 24px}
.sum-card{background:linear-gradient(180deg,#0f1830,#0c1426);border:1px solid #1f2a44;border-radius:14px;padding:16px 18px}
.sum-card .n{font-size:26px;font-weight:700;color:#fff;font-variant-numeric:tabular-nums}
.sum-card .l{color:#94a3b8;font-size:12.5px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;margin-top:2px}
.sum-card.live{border-color:#10b98155}
.sum-card.connect{border-color:#3b82f655}
.sum-card.tbd{border-color:#f59e0b55}
.sum-card.manual{border-color:#94a3b855}
.group{margin-bottom:26px}
.group h2{font-size:14px;font-weight:700;color:#e2e8f0;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.group p.note{color:#64748b;font-size:12.5px;margin:0 0 12px}
table{width:100%;border-collapse:collapse;background:linear-gradient(180deg,#0f1830,#0c1426);border:1px solid #1f2a44;border-radius:14px;overflow:hidden}
th{text-align:left;color:#64748b;font-weight:600;padding:10px 14px;border-bottom:1px solid #1f2a44;font-size:11px;text-transform:uppercase;letter-spacing:.03em;background:#0c1426}
td{padding:11px 14px;border-bottom:1px solid #16203a;font-size:13.5px;color:#cbd5e1;vertical-align:middle}
tr:last-child td{border-bottom:none}
.chip{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.02em;white-space:nowrap}
.chip-live{background:#065f46;color:#a7f3d0}
.chip-connect{background:#1e3a8a;color:#bfdbfe}
.chip-tbd{background:#78350f;color:#fed7aa}
.chip-manual{background:#334155;color:#cbd5e1}
.chip-ontarget{background:#065f46;color:#a7f3d0}
.chip-near{background:#78350f;color:#fed7aa}
.chip-off{background:#7f1d1d;color:#fecaca}
.chip-nogoal{background:#1e293b;color:#64748b}
.chip-nodata{background:#1e293b;color:#64748b}
.channel{color:#94a3b8;font-size:12px}
.kpi-name{color:#fff;font-weight:600}
.source{color:#94a3b8;font-size:12.5px}
.actual{font-variant-numeric:tabular-nums;color:#e5e7eb;font-weight:600}
.range-vals{font-size:12.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.rv-floor{color:#94a3b8}.rv-target{color:#fff;font-weight:700}.rv-stretch{color:#a7f3d0}
.rv-sep{color:#475569;margin:0 5px}
.bar{height:6px;border-radius:999px;background:#16203a;width:150px;margin-top:6px;position:relative}
.bar div{height:100%;border-radius:999px}
.bar .tick{position:absolute;top:-2px;width:2px;height:10px;background:#64748b;border-radius:1px}
.bar .tick-stretch{background:#34d399}
.note-inline{color:#64748b;font-size:11px;display:block;margin-top:3px}
footer{color:#475569;font-size:12px;text-align:center;margin-top:20px}
@media (max-width:700px){.summary{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="wrap">
<div class="head">
<h1>Brand Awareness KPI Tracker</h1>
<p>The 16 KPIs from the marketing KPI wishlist — what's live, what's blocked, and whether the team is on target where we have real numbers.</p>
</div>
<div class="banner" id="banner"></div>

<div class="summary" id="summary"></div>

<div id="groups"></div>

<footer>Mozaik Insights · Marketing · Source of truth for the KPI walkthrough</footer>
</div>

<script>
// Real actuals wired from marketing-dashboard.html's live Supermetrics data (June 2026, latest complete month).
// Facebook Organic = unique media viewers (Meta retired the old "page reach" metric — this is its successor).
// LinkedIn Organic = impressions (LinkedIn doesn't report unique reach for company pages).
// Facebook Paid Reach is NOT separately tracked yet — Meta Ads reach is ~99% Instagram, so it's shown against
// the same combined Meta paid-reach number until FB is broken out on its own.
const ACTUALS = {
  "Instagram|Organic Reach": {value: 1375999, period: "Jun 2026", note: null},
  "Instagram|Paid Reach":    {value: 1428107, period: "Jun 2026", note: null},
  "Facebook|Paid Reach":     {value: 841, period: "Jun 2026", note: "FB-only paid reach (Meta placement split) — placements overwhelmingly favor Instagram; peaked at 3.4k in April."},
  "Facebook|Organic Reach":  {value: 305819, period: "Jun 2026", note: "Unique media viewers — Meta retired the old page-reach metric; this is its closest successor."},
  "LinkedIn|Organic Reach":  {value: 5782, period: "Jun 2026", note: "Impressions — LinkedIn doesn't report unique reach for company pages."},
  "Google|Branded Search Volume": {value: 20581, period: "Jun 2026", note: "Branded impressions (queries containing 'mozaik') via Google Search Console; 2,267 branded clicks. Peaked at 32.4k in March."},
  "Google|Direct Traffic": {value: 6487, period: "Jun 2026", note: "Direct sessions (GA4, Mozaik Design property); 5,753 users. Peaked at 13.6k in March."}
};

// Baked-in monthly goal ranges — same for everyone, derived from 2026 actuals:
// floor = trailing 3-month average, target ≈ +15%, stretch = best month achieved in 2026.
const RANGES = {
  "Instagram|Organic Reach": {floor: 1200000, target: 1400000, stretch: 1500000},
  "Instagram|Paid Reach":    {floor: 1300000, target: 1500000, stretch: 1700000},
  "Facebook|Organic Reach":  {floor: 430000,  target: 500000,  stretch: 560000},
  "Facebook|Paid Reach":     {floor: 1000,    target: 2500,    stretch: 3500},
  "LinkedIn|Organic Reach":  {floor: 10000,   target: 12000,   stretch: 16000},
  "Google|Branded Search Volume": {floor: 25000, target: 29000, stretch: 32000},
  "Google|Direct Traffic": {floor: 6000, target: 7000, stretch: 13500}
};

const KPIS = [
{"channel":"Instagram","kpi":"Organic Reach","source":"Instagram Insights (Supermetrics)","status":"Live"},
{"channel":"Instagram","kpi":"Paid Reach","source":"Meta Ads (Supermetrics)","status":"Live"},
{"channel":"Facebook","kpi":"Organic Reach","source":"Facebook Insights (Supermetrics)","status":"Live"},
{"channel":"Facebook","kpi":"Paid Reach","source":"Meta Ads (Supermetrics)","status":"Live"},
{"channel":"LinkedIn","kpi":"Organic Reach","source":"LinkedIn Pages (Supermetrics)","status":"Live"},
{"channel":"LinkedIn","kpi":"Paid Reach","source":"LinkedIn Ads (Supermetrics)","status":"Connect"},
{"channel":"YouTube","kpi":"Organic Reach","source":"YouTube (Supermetrics)","status":"Connect"},
{"channel":"YouTube","kpi":"Paid Reach","source":"Google Ads (Supermetrics)","status":"Connect"},
{"channel":"Instagram","kpi":"# Mozaik Design mentions","source":"Social listening tool","status":"Source TBD"},
{"channel":"LinkedIn","kpi":"# Mozaik Design mentions","source":"Social listening tool","status":"Source TBD"},
{"channel":"Facebook","kpi":"# Mozaik Design mentions","source":"Social listening tool","status":"Source TBD"},
{"channel":"YouTube","kpi":"# Mozaik Design mentions","source":"Social listening tool","status":"Source TBD"},
{"channel":"Google","kpi":"Branded Search Volume","source":"Google Search Console (Supermetrics)","status":"Live"},
{"channel":"Google","kpi":"Direct Traffic","source":"Google Analytics GA4 (Supermetrics)","status":"Live"},
{"channel":"All channels","kpi":"Share of Voice","source":"Social listening tool","status":"Source TBD"},
{"channel":"Referrals","kpi":"# of Referrals","source":"CRM / manual entry","status":"Manual"}
].map(k => Object.assign(k, {
  key: k.channel + '|' + k.kpi,
  actual: (ACTUALS[k.channel + '|' + k.kpi] || null)
}));

const STATUS_META = {
  "Live":    {chip:"chip-live",    label:"Live"},
  "Connect": {chip:"chip-connect", label:"Connect"},
  "Source TBD": {chip:"chip-tbd",  label:"Source TBD"},
  "Manual":  {chip:"chip-manual",  label:"Manual"}
};

const GROUPS = [
  {status:"Live", icon:"✅", title:"Live in the dashboard", note:"Already pulling real data — goal ranges (floor → target → stretch) are baked in and shared by the whole team."},
  {status:"Connect", icon:"🔌", title:"Needs a connector authorized", note:"Data source exists (Supermetrics / GA4) — just needs sign-in / authorization to start pulling."},
  {status:"Source TBD", icon:"❓", title:"No data source picked yet", note:"Needs a social-listening tool (e.g. Ahrefs Brand Radar) before this can be automated."},
  {status:"Manual", icon:"✋", title:"No automation path", note:"Best tracked by hand / CRM entry — not a connector job."}
];

function fmt(n){
  if(n>=1e6) return (n/1e6).toFixed(2)+'M';
  if(n>=1e3) return (n/1e3).toFixed(0)+'k';
  return String(n);
}

function counts(){
  const c = {Live:0, Connect:0, "Source TBD":0, Manual:0};
  KPIS.forEach(k=>c[k.status]++);
  return c;
}

function renderSummary(){
  const c = counts();
  const cards = [
    ["live","Live",c.Live],
    ["connect","Connect",c.Connect],
    ["tbd","Source TBD",c["Source TBD"]],
    ["manual","Manual",c.Manual]
  ];
  document.getElementById('summary').innerHTML = cards.map(([cls,label,n])=>
    '<div class="sum-card '+cls+'"><div class="n">'+n+'</div><div class="l">'+label+'</div></div>'
  ).join('');
}

function statusFor(actual, range){
  if(actual == null) return {chip:'chip-nodata', label:'Awaiting data'};
  if(!range) return {chip:'chip-nogoal', label:'No goal set'};
  const pct = actual / range.target * 100;
  if(actual >= range.stretch) return {chip:'chip-ontarget', label:'Stretch hit 🎯', pct};
  if(actual >= range.target) return {chip:'chip-ontarget', label:'On target', pct};
  if(actual >= range.floor) return {chip:'chip-near', label:'Above floor', pct};
  return {chip:'chip-off', label:'Below floor', pct};
}

function renderGroups(){
  const html = GROUPS.map(g=>{
    const rows = KPIS.filter(k=>k.status===g.status);
    if(!rows.length) return '';
    const trs = rows.map(r=>{
      const range = RANGES[r.key] || null;
      const actualVal = r.actual ? r.actual.value : null;
      const st = statusFor(actualVal, range);
      const actualCell = actualVal
        ? '<span class="actual">'+fmt(actualVal)+'</span><span class="note-inline">'+r.actual.period+(r.actual.note ? ' · '+r.actual.note : '')+'</span>'
        : '<span style="color:#475569">—</span>';
      let goalCell = '<span style="color:#475569">—</span>';
      if(range){
        const barPct = st.pct != null ? Math.min(100, st.pct) : 0;
        const stretchPct = Math.min(100, range.stretch / range.target * 100);
        const floorPct = Math.min(100, range.floor / range.target * 100);
        const barColor = st.chip==='chip-ontarget' ? '#10b981' : st.chip==='chip-near' ? '#f59e0b' : '#ef4444';
        goalCell =
          '<span class="range-vals"><span class="rv rv-floor" title="Floor — trailing 3-month average">'+fmt(range.floor)+'</span>' +
          '<span class="rv-sep">→</span><span class="rv rv-target" title="Target — floor +15%">'+fmt(range.target)+'</span>' +
          '<span class="rv-sep">→</span><span class="rv rv-stretch" title="Stretch — best month of 2026">'+fmt(range.stretch)+'</span></span>' +
          '<div class="bar" title="Bar = actual vs target. Ticks = floor and stretch.">' +
            '<div style="width:'+barPct+'%;background:'+barColor+'"></div>' +
            '<span class="tick" style="left:'+floorPct+'%"></span>' +
            '<span class="tick tick-stretch" style="left:'+stretchPct+'%"></span>' +
          '</div>';
      }
      return '<tr><td class="channel">'+r.channel+'</td><td class="kpi-name">'+r.kpi+'</td><td class="source">'+r.source+'</td>'+
        '<td>'+actualCell+'</td><td>'+goalCell+'</td>'+
        '<td><span class="chip '+st.chip+'">'+st.label+'</span></td></tr>';
    }).join('');
    return '<div class="group"><h2>'+g.icon+' '+g.title+' <span style="color:#475569;font-weight:400">('+rows.length+')</span></h2>'+
      '<p class="note">'+g.note+'</p>'+
      '<table><thead><tr><th>Channel</th><th>KPI</th><th>Intended source</th><th>Actual</th><th>Goal · floor → target → stretch</th><th>On target?</th></tr></thead><tbody>'+trs+'</tbody></table></div>';
  }).join('');
  document.getElementById('groups').innerHTML = html;
}

document.getElementById('banner').innerHTML =
  '<b>Goals are baked into the page — everyone sees the same ranges.</b> Monthly goals per KPI: ' +
  '<b>floor</b> (trailing 3-month average — falling below this means something broke), ' +
  '<b>target</b> (≈ floor +15%) and <b>stretch</b> (best month achieved in 2026). ' +
  'Chip: red = below floor · amber = above floor · green = target hit · 🎯 = stretch hit. Ask Claude to raise the ranges as months finalize.';

renderSummary();
renderGroups();
</script>
</body>
</html>
